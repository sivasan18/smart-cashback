<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cashback - Interactive Lamp Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            gold: '#FBBF24',
                            glow: '#F59E0B',
                            dark: '#07090E',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base page styling */
        body {
            background-color: #07090e;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.6s ease;
        }

        /* Ambient floating fireflies canvas */
        #fireflies-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
            transition: opacity 0.8s ease;
        }

        .lamp-active #fireflies-canvas {
            opacity: 1;
        }

        /* Volumetric Light Cone projecting from the lamp */
        .light-cone {
            position: absolute;
            top: 15px;
            left: 60px;
            width: 750px;
            height: 600px;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(
                ellipse 85% 75% at 5% 20%, 
                rgba(251, 191, 36, 0.45) 0%, 
                rgba(245, 158, 11, 0.22) 35%, 
                rgba(245, 158, 11, 0.08) 60%, 
                rgba(7, 9, 14, 0) 80%
            );
            clip-path: polygon(4% 18%, 100% 0%, 100% 100%, 0% 88%);
            filter: blur(12px);
            opacity: 0;
            transform: scale(0.92);
            transform-origin: 5% 20%;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lamp-active .light-cone {
            opacity: 1;
            transform: scale(1);
        }

        /* Bulb inner & outer glow */
        .bulb-glow {
            opacity: 0;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }
        .lamp-active .bulb-glow {
            opacity: 1;
            filter: drop-shadow(0 0 24px #fbbf24) drop-shadow(0 0 45px #f59e0b);
        }

        /* Lamp pull cord physics animation */
        .pull-cord-group {
            cursor: grab;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 92px 64px;
        }
        .pull-cord-group:active {
            cursor: grabbing;
        }
        .pull-cord-pulled {
            animation: pullStringAnim 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pullStringAnim {
            0% { transform: translateY(0); }
            35% { transform: translateY(22px); }
            65% { transform: translateY(-6px); }
            85% { transform: translateY(3px); }
            100% { transform: translateY(0); }
        }

        /* Login Card lighting reaction */
        .login-card-container {
            transition: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        /* Dark/Off State */
        .scene-dark .login-card-container {
            opacity: 0.18;
            filter: grayscale(100%) brightness(0.28) contrast(0.85);
            transform: translateY(4px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.95);
        }

        /* Lit/Active State */
        .scene-lit .login-card-container {
            opacity: 1;
            filter: grayscale(0%) brightness(1) contrast(1);
            transform: translateY(0);
            box-shadow: 0 25px 60px -15px rgba(251, 191, 36, 0.15), 
                        0 0 0 1px rgba(251, 191, 36, 0.25),
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* Custom glow focus for inputs */
        .input-lit:focus {
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.5), 0 0 20px rgba(245, 158, 11, 0.25);
            border-color: #fbbf24;
        }

        /* Indicator tooltip when lamp is off */
        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .hint-pulse {
            animation: floatUpDown 1.8s ease-in-out infinite;
        }

        /* Locked shake animation if clicked while dark */
        @keyframes lockedShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-active {
            animation: lockedShake 0.45s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative antialiased selection:bg-amber-400 selection:text-black scene-dark">

    <!-- Ambient Fireflies Background -->
    <canvas id="fireflies-canvas"></canvas>

    <!-- Main Container Card Wrap -->
    <main class="w-full max-w-4xl relative z-10 my-auto flex flex-col md:flex-row items-center justify-center gap-4 lg:gap-8 min-h-[580px]">

        <!-- ================= LEFT: Interactive Floor/Desk Lamp ================= -->
        <div class="relative w-[240px] md:w-[300px] h-[340px] md:h-[460px] flex items-center justify-center shrink-0">
            
            <!-- Volumetric Light Beam Projection Layer -->
            <div id="lightCone" class="light-cone hidden md:block"></div>

            <!-- Mobile circular light beam fallback -->
            <div id="mobileCone" class="md:hidden absolute -bottom-10 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-amber-400/20 blur-3xl opacity-0 transition-opacity duration-700 pointer-events-none"></div>

            <!-- SVG Vector Lamp -->
            <svg class="w-full h-full relative z-20 filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)]" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Desk/Floor Base plate -->
                <ellipse cx="70" cy="280" rx="42" ry="7" fill="#1E222D" stroke="#333A48" stroke-width="1.5" />
                <ellipse cx="70" cy="278" rx="35" ry="5" fill="#2A303F" />
                
                <!-- Lamp Stand / Stem -->
                <path d="M70 278 L70 95" stroke="#374151" stroke-width="5" stroke-linecap="round" />
                <path d="M70 95 C 70 70, 92 65, 92 65" stroke="#4B5563" stroke-width="4.5" stroke-linecap="round" fill="none" />

                <!-- Lamp Fixture & Shade -->
                <path d="M 52 65 L 132 65 L 115 28 L 69 28 Z" fill="#171A21" stroke="#374151" stroke-width="1.5" />
                <ellipse cx="92" cy="65" rx="40" ry="10" fill="#1F2430" stroke="#4B5563" stroke-width="1.5" />

                <!-- Bulb Glow (Toggled via JS) -->
                <g id="bulbGlow" class="bulb-glow">
                    <!-- Outer warm cone base inside fixture -->
                    <ellipse cx="92" cy="65" rx="36" ry="8" fill="#FBBF24" opacity="0.95" />
                    <!-- Core bright incandescent bulb center -->
                    <ellipse cx="92" cy="65" rx="20" ry="5" fill="#FFFBEB" />
                    <circle cx="92" cy="66" r="14" fill="url(#bulbGrad)" />
                </g>

                <!-- Interactive Hanging Pull String Cord -->
                <g id="pullCord" class="pull-cord-group" onclick="toggleLamp()">
                    <!-- Invisible wider hit area for easy click/tap -->
                    <rect x="75" y="65" width="34" height="90" fill="transparent" />
                    <!-- String line -->
                    <line x1="92" y1="65" x2="92" y2="128" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="2 1.5" />
                    <!-- Golden pull bead / tassel with pulse glow -->
                    <ellipse cx="92" cy="132" rx="5" ry="7.5" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" class="filter drop-shadow-[0_0_6px_#fbbf24]" />
                    <circle cx="92" cy="130" r="2" fill="#FEF3C7" />
                </g>

                <!-- Radial Gradient Definitions -->
                <defs>
                    <radialGradient id="bulbGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(92 66) rotate(90) scale(14)">
                        <stop stop-color="#FFFFFF" />
                        <stop offset="0.4" stop-color="#FEF08A" />
                        <stop offset="0.9" stop-color="#F59E0B" />
                        <stop offset="1" stop-color="#B45309" stop-opacity="0" />
                    </radialGradient>
                </defs>
            </svg>

            <!-- Interactive Hint Prompt (Shows when lamp is off) -->
            <div id="pullHint" class="hint-pulse absolute top-36 -right-4 sm:-right-8 bg-amber-400 text-neutral-950 text-xs font-bold px-3 py-1.5 rounded-full shadow-lg shadow-amber-500/30 flex items-center gap-1.5 cursor-pointer pointer-events-auto transition-all duration-300 z-30" onclick="toggleLamp()">
                <span>Pull cord to turn on light</span>
                <svg class="w-3.5 h-3.5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </div>

        <!-- ================= RIGHT: Streamlined Login Card ================= -->
        <div id="loginCardWrapper" class="login-card-container w-full max-w-[390px] px-2 sm:px-0">
            <div class="relative backdrop-blur-xl bg-slate-900/60 border border-slate-700/60 rounded-3xl p-7 sm:p-9 shadow-2xl overflow-hidden transition-colors duration-500">
                
                <!-- Overlay shield intercepting clicks when light is OFF -->
                <div id="darkLockShield" onclick="handleLockedClick()" class="absolute inset-0 z-40 cursor-not-allowed bg-black/40 flex flex-col items-center justify-center p-4 backdrop-blur-[2px] transition-opacity duration-300">
                    <div class="bg-neutral-900/90 border border-amber-400/40 text-amber-300 px-4 py-2 rounded-xl text-xs font-semibold shadow-xl flex items-center gap-2 pointer-events-none">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span>Turn on the lamp first! 💡</span>
                    </div>
                </div>

                <!-- Ambient Subtle Corner Light Accent inside card -->
                <div class="absolute -top-12 -right-12 w-36 h-36 bg-amber-400/10 rounded-full blur-2xl pointer-events-none"></div>

                <!-- Branding Header -->
                <div class="text-left mb-7">
                    <div class="inline-flex items-center gap-2.5 mb-2">
                        <div class="w-9 h-9 rounded-xl bg-amber-400/15 border border-amber-400/30 flex items-center justify-center text-amber-400">
                            <!-- Cashback Icon -->
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
                            Smart <span class="text-amber-400">Cashback</span>
                        </h1>
                    </div>
                    <p class="text-xs text-neutral-400">Sign in to manage and claim your daily rewards</p>
                </div>

                <!-- Login Form (Only Email, Password, Login Button) -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1.5 ml-1">Email ID</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                                </svg>
                            </div>
                            <input 
                                type="email" 
                                id="email" 
                                required
                                disabled
                                placeholder="name@smartcashback.com"
                                class="input-lit w-full pl-10 pr-4 py-3 bg-neutral-950/70 border border-neutral-700/80 rounded-xl text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed"
                            />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1.5 ml-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input 
                                type="password" 
                                id="password" 
                                required
                                disabled
                                placeholder="••••••••••••"
                                class="input-lit w-full pl-10 pr-10 py-3 bg-neutral-950/70 border border-neutral-700/80 rounded-xl text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed"
                            />
                            <!-- Toggle Password Visibility -->
                            <button 
                                type="button" 
                                id="eyeToggleBtn"
                                disabled
                                onclick="togglePasswordVisibility()" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-500 hover:text-amber-400 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                            >
                                <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit / Login Button -->
                    <div class="pt-2">
                        <button 
                            type="submit" 
                            id="loginBtn"
                            disabled
                            class="w-full relative group overflow-hidden bg-amber-400 hover:bg-amber-300 active:scale-[0.98] text-neutral-950 font-bold py-3.5 px-6 rounded-xl transition-all duration-200 shadow-[0_0_25px_rgba(251,191,36,0.35)] hover:shadow-[0_0_35px_rgba(251,191,36,0.6)] flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
                        >
                            <span id="btnText">Login</span>
                            <svg id="btnArrow" class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                            <!-- Spinner state (hidden by default) -->
                            <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin text-neutral-950" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Feedback Message Notification Area -->
                <div id="statusMessage" class="mt-4 p-3 rounded-xl text-center text-xs font-semibold hidden transition-all duration-300"></div>
            </div>
        </div>

    </main>

    <!-- Bottom Light Switch Indicator Pill -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 bg-neutral-900/90 border border-neutral-800 backdrop-blur-md px-4 py-1.5 rounded-full text-xs text-neutral-400">
        <span class="w-2 h-2 rounded-full" id="statusDot" style="background-color: #4b5563;"></span>
        <span id="lampStatusText">Lamp: Powered Off</span>
        <button onclick="toggleLamp()" class="text-amber-400 hover:underline font-medium ml-1">Pull Cord</button>
    </div>

    <!-- Script: Lamp Illumination Logic & Canvas Fireflies -->
    <script>
        // Initial State is OFF
        let isLampOn = false;

        // Initialize state on DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            initFireflies();
            applyLampState(false);
        });

        // Trigger gentle shake when user tries to interact while dark
        function handleLockedClick() {
            const card = document.getElementById('loginCardWrapper');
            card.classList.remove('shake-active');
            void card.offsetWidth; // Force reflow
            card.classList.add('shake-active');

            // Pulse the pull hint to guide user
            const pullHint = document.getElementById('pullHint');
            pullHint.classList.add('scale-110');
            setTimeout(() => {
                pullHint.classList.remove('scale-110');
            }, 300);
        }

        // Toggle Lamp on pulling cord or clicking button
        function toggleLamp() {
            const pullCord = document.getElementById('pullCord');
            
            // Trigger haptic pull animation
            pullCord.classList.remove('pull-cord-pulled');
            void pullCord.offsetWidth; // Force reflow
            pullCord.classList.add('pull-cord-pulled');

            // Play synthesized mechanical switch sound
            playLampClickSound();

            // Toggle Boolean
            isLampOn = !isLampOn;
            applyLampState(isLampOn);
        }

        // Apply visual updates and enable/disable inputs based on lamp state
        function applyLampState(isOn) {
            const body = document.body;
            const lightCone = document.getElementById('lightCone');
            const mobileCone = document.getElementById('mobileCone');
            const pullHint = document.getElementById('pullHint');
            const statusDot = document.getElementById('statusDot');
            const lampStatusText = document.getElementById('lampStatusText');
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const eyeToggleBtn = document.getElementById('eyeToggleBtn');
            const darkLockShield = document.getElementById('darkLockShield');

            if (isOn) {
                // LIT STATE
                body.classList.remove('scene-dark');
                body.classList.add('scene-lit', 'lamp-active');
                lightCone.style.opacity = '1';
                mobileCone.style.opacity = '1';
                pullHint.style.opacity = '0';
                pullHint.style.pointerEvents = 'none';
                statusDot.style.backgroundColor = '#fbbf24';
                statusDot.style.boxShadow = '0 0 8px #fbbf24';
                lampStatusText.textContent = 'Lamp: Illuminated';

                // Unlock Shield & Enable all Form Inputs
                darkLockShield.classList.add('hidden');
                emailInput.disabled = false;
                passwordInput.disabled = false;
                loginBtn.disabled = false;
                eyeToggleBtn.disabled = false;

                // Auto-focus email field once illuminated
                setTimeout(() => {
                    emailInput.focus();
                }, 400);

            } else {
                // DARK / OFF STATE (LOCKED)
                body.classList.remove('scene-lit', 'lamp-active');
                body.classList.add('scene-dark');
                lightCone.style.opacity = '0';
                mobileCone.style.opacity = '0';
                pullHint.style.opacity = '1';
                pullHint.style.pointerEvents = 'auto';
                statusDot.style.backgroundColor = '#4b5563';
                statusDot.style.boxShadow = 'none';
                lampStatusText.textContent = 'Lamp: Powered Off';

                // Lock Shield & Disable all Form Inputs strictly
                darkLockShield.classList.remove('hidden');
                emailInput.disabled = true;
                passwordInput.disabled = true;
                loginBtn.disabled = true;
                eyeToggleBtn.disabled = true;
                
                // Unfocus any active element
                if (document.activeElement) {
                    document.activeElement.blur();
                }
            }
        }

        // Realistic mechanical click synthesizer using Web Audio API
        function playLampClickSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.06);
            } catch(e) {
                // Audio context handled silently
            }
        }

        // Toggle password show/hide
        function togglePasswordVisibility() {
            if (!isLampOn) return;
            const passwordInput = document.getElementById('password');
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        }

        // Form Submission handler
        function handleLogin(event) {
            event.preventDefault();
            if (!isLampOn) return;

            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnArrow = document.getElementById('btnArrow');
            const btnSpinner = document.getElementById('btnSpinner');
            const statusMsg = document.getElementById('statusMessage');

            // Loading state
            btn.disabled = true;
            btnText.textContent = "Verifying...";
            btnArrow.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            statusMsg.classList.add('hidden');

            setTimeout(() => {
                btn.disabled = false;
                btnText.textContent = "Login";
                btnArrow.classList.remove('hidden');
                btnSpinner.classList.add('hidden');

                // Success response display
                statusMsg.className = "mt-4 p-3 rounded-xl text-center text-xs font-semibold bg-amber-400/20 text-amber-300 border border-amber-400/40";
                statusMsg.textContent = `Welcome back! Signed in as ${email}`;
                statusMsg.classList.remove('hidden');
            }, 1200);
        }

        // ================= Ambient Golden Fireflies Canvas =================
        function initFireflies() {
            const canvas = document.getElementById('fireflies-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const fireflyCount = 28;
            const fireflies = [];

            class Firefly {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.radius = Math.random() * 2 + 0.8;
                    this.baseAlpha = Math.random() * 0.5 + 0.2;
                    this.alpha = this.baseAlpha;
                    this.speedX = (Math.random() - 0.5) * 0.45;
                    this.speedY = (Math.random() - 0.5) * 0.45;
                    this.pulseSpeed = Math.random() * 0.025 + 0.01;
                    this.pulse = Math.random() * Math.PI;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.pulse += this.pulseSpeed;

                    // Twinkle
                    this.alpha = this.baseAlpha + Math.sin(this.pulse) * 0.25;
                    if (this.alpha < 0.05) this.alpha = 0.05;

                    // Boundary wrap
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }

                draw() {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251, 191, 36, ${this.alpha})`;
                    ctx.shadowColor = '#FBBF24';
                    ctx.shadowBlur = this.radius * 6;
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < fireflyCount; i++) {
                fireflies.push(new Firefly());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let f of fireflies) {
                    f.update();
                    f.draw();
                }
                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
